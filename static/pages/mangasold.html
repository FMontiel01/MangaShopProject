<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manga Sold</title>
  <link rel="stylesheet" href="../css/search.css">
</head>
<body class="gradient-background">
  <h1>Manga Sold</h1>
  <form action="/record_manga_sold" method="POST" onsubmit="handleMangaSold(event)">
    <label for="title">Manga Title:</label>
    <input type="text" id="title" name="title" required><br>
    <label for="quantity">Quantity Sold:</label>
    <input type="number" id="quantity" name="quantity" required><br>
    <button type="submit">Submit</button>
  </form>
  <button onclick="window.location.href='/'">Go Back</button>

  <script>
    async function handleMangaSold(event) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);
      const title = formData.get('title');
      const quantitySold = parseInt(formData.get('quantity'), 10);

      // Check if the title exists and get the current quantity
      const response = await fetch(`/search_manga?title=${encodeURIComponent(title)}`);
      if (response.ok) {
        const data = await response.json();
        const currentQuantity = parseInt(data.quantity, 10);

        if (quantitySold <= 0) {
          alert('Quantity sold must be greater than zero.');
          return;
        }

        if (quantitySold > currentQuantity) {
          alert('Quantity sold exceeds available quantity.');
          return;
        }

        // Proceed with recording the sale
        const saleData = { title, quantity: quantitySold };
        const saleResponse = await fetch('/record_manga_sold', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(saleData)
        });

        const result = await saleResponse.json();
        alert(result.message);
        form.reset();

        if (result.new_quantity === 0) {
          await fetch(`/delete_manga?title=${encodeURIComponent(title)}`, {
            method: 'DELETE'
          });
          alert('Manga deleted as the quantity reached zero.');
        }
      } else {
        alert('Manga not found.');
      }
    }
  </script>
</body>
</html>
