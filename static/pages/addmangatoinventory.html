<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Manga</title>
    <link rel="stylesheet" href="../css/search.css">
</head>
<body class="gradient-background">
    <h1>Add Manga to Inventory</h1>
    <form id="addMangaForm" action="/add_manga" method="POST" onsubmit="handleAddManga(event)">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required><br>
        <label for="author">Author:</label>
        <input type="text" id="author" name="author" required><br>
        <label for="genre">Genre:</label>
        <input type="text" id="genre" name="genre" required><br>
        <label for="price">Price:</label>
        <input type="number" id="price" name="price" step="0.01" required><br>
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" required><br>
        <button type="submit">Add Manga</button>
    </form>
    <button onclick="window.location.href='/'">Go Back</button>

    <script>
        async function handleAddManga(event) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const title = formData.get('title');

            // Check if the title already exists
            const response = await fetch(`/search_manga?title=${encodeURIComponent(title)}`);
            if (response.ok) {
                const data = await response.json();
                if (data.title) {
                    if (parseInt(data.quantity) === 0) {
                        // Update the existing manga with new quantity
                        const updateData = {};
                        formData.forEach((value, key) => {
                            updateData[key] = value;
                        });

                        fetch('/add_manga', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify(updateData)
                        })
                        .then(response => response.json())
                        .then(data => {
                            alert(data.message);
                            form.reset();
                        })
                        .catch(error => {
                            console.error('Error:', error);
                        });
                    } else {
                        alert('This manga title already exists in the inventory.');
                    }
                    return;
                }
            }

            // If title does not exist, proceed with adding the manga
            const data = {};
            formData.forEach((value, key) => {
                data[key] = value;
            });

            fetch('/add_manga', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                form.reset();
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
